name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Test the supported floor (3.8, per pyproject.toml) and current
      # interpreters. Intermediate versions add runtime without meaningful
      # signal. 3.13 excluded until the pinned deps (jsonschema~=3.0,
      # dulwich~=0.19) are verified against it.
      matrix:
        python-version: ["3.8", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt -r requirements.txt
          pip install -e .

      - name: Run unit tests with coverage
        run: pytest --cov=./taskcat/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: .coverage
          include-hidden-files: true
