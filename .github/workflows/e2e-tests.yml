# End-to-End Tests Workflow
#
# Replicates the e2e testing from do_e2e_tests.sh and e2e/codebuild/.
# Runs all test scripts in e2e/tests/ with coverage instrumentation.
#
# ─── Required Setup ───────────────────────────────────────────────────────────
#
# Option A (Preferred): GitHub OIDC with AWS IAM
#   1. Create an IAM OIDC identity provider for GitHub Actions in your AWS account:
#      - Provider URL: https://token.actions.githubusercontent.com
#      - Audience: sts.amazonaws.com
#   2. Create or update the 'taskcat-e2e-test' IAM role with:
#      - AdministratorAccess policy (needed for CloudFormation stack operations)
#      - Trust policy allowing the GitHub OIDC provider for this repo:
#        {
#          "Version": "2012-10-17",
#          "Statement": [{
#            "Effect": "Allow",
#            "Principal": {
#              "Federated": "arn:aws:iam::<ACCOUNT_ID>:oidc-provider/token.actions.githubusercontent.com"
#            },
#            "Action": "sts:AssumeRoleWithWebIdentity",
#            "Condition": {
#              "StringEquals": {
#                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
#              },
#              "StringLike": {
#                "token.actions.githubusercontent.com:sub": "repo:<ORG>/<REPO>:ref:refs/heads/main"
#              }
#            }
#          }]
#        }
#   3. Set repository secret:
#      - E2E_ROLE_ARN: The ARN of the 'taskcat-e2e-test' role
#        (e.g., arn:aws:iam::123456789012:role/taskcat-e2e-test)
#
# Option B (Fallback): Static IAM credentials
#   Set repository secrets:
#   - AWS_ACCESS_KEY_ID: Access key for an IAM user that can assume 'taskcat-e2e-test'
#   - AWS_SECRET_ACCESS_KEY: Corresponding secret key
#   - E2E_ROLE_ARN: The ARN of the 'taskcat-e2e-test' role
#
# ─── Notes ────────────────────────────────────────────────────────────────────
#
# - Only triggers on push to main (not PRs) to prevent credential exposure to forks
# - The 'taskcat-e2e-test' role requires AdministratorAccess for CloudFormation operations
# - test_cli.sh and test_stack_url_helper.sh require valid AWS credentials
# - Coverage is collected across all test scripts and uploaded as an artifact
#

name: E2E Tests

on:
  push:
    branches: [main]

# Required for GitHub OIDC token retrieval
permissions:
  id-token: write
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    # Prevent concurrent e2e runs that could conflict on AWS resources
    concurrency:
      group: e2e-tests-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Option A: OIDC-based credential configuration (preferred)
      # Falls back to Option B if OIDC is not configured
      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.USE_OIDC == 'true' || vars.USE_OIDC == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.E2E_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: github-e2e-test
        continue-on-error: true
        id: oidc-creds

      # Option B: Static credentials fallback - assume the e2e test role
      - name: Configure AWS credentials (static keys + role assumption)
        if: steps.oidc-creds.outcome == 'failure' || steps.oidc-creds.outcome == 'skipped'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.E2E_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: github-e2e-test

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt -r requirements.txt
          pip install coverage
          pip install -e .

      - name: Run e2e tests with coverage
        working-directory: e2e/tests
        env:
          # Mirrors the COV_CMD and BIN variables from e2e/codebuild/run-e2e.sh
          COV_CMD: "coverage run -a --source ../../taskcat/ --omit ../../taskcat/_stacker.py"
          BIN: "../../bin/taskcat"
        run: |
          # Remove stale coverage data
          rm -f .coverage

          FAILED=0

          for t in help.sh lint.sh package.sh test_cli.sh test_import.sh test_stack_url_helper.sh; do
            echo "──────────────────────────────────────────────"
            echo "Running: ${t}"
            echo "──────────────────────────────────────────────"
            chmod +x ./${t}
            if ! BIN="${BIN}" COV_CMD="${COV_CMD}" ./${t}; then
              echo "FAILED: ${t}"
              FAILED=1
            fi
          done

          # Generate coverage report
          coverage report | tee ../../cov_report

          if [[ ${FAILED} -ne 0 ]]; then
            echo "One or more e2e tests FAILED"
            exit 1
          fi

          echo "ALL E2E TESTS PASSED"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-report
          path: |
            cov_report
            e2e/tests/.coverage
