name: Static Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Lint results don't vary by interpreter, so this runs once on a single
    # Python version. The unit test suite (pytest-local hook) is skipped here
    # because unit-tests.yml already runs it across the full version matrix.
    env:
      SKIP: pytest-local

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Install git-secrets
        run: |
          # Pinned by SHA (master @ 2025-09-17) rather than the ancient 1.3.0 tag:
          # picks up Amazon Bedrock API key patterns in --register-aws, while
          # staying immutable against future upstream changes.
          git clone https://github.com/awslabs/git-secrets.git
          cd git-secrets
          git checkout 7d6b970cbd3c216353cb22b383b70c150140662e
          sudo make install
          cd ..
          rm -rf git-secrets
          git secrets --register-aws

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt -r requirements.txt

      - name: Run pre-commit
        run: |
          pre-commit run --all-files
