# E2E tests on request
#
# The e2e tests create real AWS resources, so they do not run for every pull
# request. A person with write access asks for a run with a comment on the
# pull request:
#
#   /run-e2e                  test the commit that is the head of the pull request now
#   /run-e2e <full commit>    the same, but fail if the head is not this commit
#
# Use the second form when the pull request comes from a fork: it names the
# commit that you reviewed, so a push that arrives after your review cannot run.
#
# GitHub runs this workflow from the default branch for comment events, so a
# pull request cannot change it. The workflow does not check out or run code
# from the pull request. It checks the commenter's access, pins the head commit,
# and starts a CodeBuild project in the project's AWS account. That project
# fetches the pinned commit and runs it with its own scoped role. The result is
# a commit status named `e2e` on the pinned commit.
#
# A re-run of this workflow does nothing. Comment again to run again.
#
# ─── Required setup ───────────────────────────────────────────────────────────
#
# AWS: the stack in taskcat-infra/e2e/template.yaml (OIDC provider, controller
# role, CodeBuild project).
#
# GitHub: an environment named `e2e`, limited to the default branch, with these
# variables:
#   E2E_CONTROLLER_ROLE_ARN   output ControllerRoleArn of the stack
#   E2E_AWS_REGION            Region of the stack
#   E2E_CODEBUILD_PROJECT     output ProjectName of the stack
# The controller role trusts only this workflow file on the default branch, in
# this environment. Add required reviewers to the environment to make each run
# wait for a second person.

name: E2E on request

on:
  issue_comment:
    types: [created]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Check the request
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Refuse a re-run
        if: github.run_attempt != 1
        run: |
          echo "::error::A re-run does not repeat an e2e request. Comment /run-e2e on the pull request."
          exit 1

      - name: Check that the commenter can write to the repository
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${COMMENTER}/permission" --jq .permission)"
          case "${permission}" in
            admin | write)
              echo "${COMMENTER} has ${permission} access."
              ;;
            *)
              echo "::error::${COMMENTER} has ${permission} access. An e2e run needs write access."
              exit 1
              ;;
          esac

      - name: Pin the head commit of the pull request
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Remove trailing spaces and line ends, then accept the two documented forms only.
          command="${COMMENT_BODY%"${COMMENT_BODY##*[![:space:]]}"}"
          if [[ ! "${command}" =~ ^/run-e2e(\ ([0-9a-f]{40}))?$ ]]; then
            echo "::error::Use '/run-e2e' or '/run-e2e <full commit SHA>'."
            exit 1
          fi
          expected="${BASH_REMATCH[2]}"

          read -r state base sha < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '[.state, .base.ref, .head.sha] | @tsv')
          if [[ "${state}" != "open" ]]; then
            echo "::error::Pull request #${PR_NUMBER} is ${state}. E2E runs are for open pull requests."
            exit 1
          fi
          if [[ "${base}" != "${DEFAULT_BRANCH}" ]]; then
            echo "::error::Pull request #${PR_NUMBER} targets ${base}. E2E runs are for pull requests into ${DEFAULT_BRANCH}."
            exit 1
          fi
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read the head commit of pull request #${PR_NUMBER}."
            exit 1
          fi
          if [[ -n "${expected}" && "${sha}" != "${expected}" ]]; then
            echo "::error::The head of pull request #${PR_NUMBER} is ${sha}, not ${expected}. Review the new commits and ask again."
            exit 1
          fi

          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "E2E run for pull request #${PR_NUMBER} at commit \`${sha}\`." >> "${GITHUB_STEP_SUMMARY}"

      - name: Mark the commit as pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pin.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=pending -f context=e2e \
            -f description="E2E build requested" -f target_url="${RUN_URL}" > /dev/null

  run:
    name: Run in CodeBuild
    needs: resolve
    runs-on: ubuntu-latest
    environment: e2e
    # Shorter than the one-hour session of the controller role. The waits below
    # add up to less: 15 minutes for a free slot, 5 in the queue, 30 for the build.
    timeout-minutes: 55
    permissions:
      id-token: write
    steps:
      - name: Refuse a re-run
        if: github.run_attempt != 1
        run: |
          echo "::error::A re-run does not repeat an e2e request. Comment /run-e2e on the pull request."
          exit 1

      - name: Assume the controller role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.E2E_CONTROLLER_ROLE_ARN }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-session-name: e2e-${{ github.run_id }}-${{ github.run_attempt }}

      # The tests share one AWS account, and the CodeBuild project runs one
      # build at a time. A request that arrives during a build waits here. The
      # limit is in AWS and not in a GitHub concurrency group, because a
      # workflow in a pull request can join a group and cancel its jobs.
      - name: Start the build
        id: start
        env:
          PROJECT: ${{ vars.E2E_CODEBUILD_PROJECT }}
          APPROVED_SHA: ${{ needs.resolve.outputs.sha }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          error_file="${RUNNER_TEMP}/start-build-error.txt"
          deadline=$((SECONDS + 900))
          while true; do
            if build_id="$(aws codebuild start-build --project-name "${PROJECT}" \
              --idempotency-token "e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --environment-variables-override \
              "name=APPROVED_SHA,value=${APPROVED_SHA},type=PLAINTEXT" \
              "name=PR_NUMBER,value=${PR_NUMBER},type=PLAINTEXT" \
              --query build.id --output text 2> "${error_file}")"; then
              break
            fi
            if ! grep -q AccountLimitExceededException "${error_file}" || ((SECONDS >= deadline)); then
              cat "${error_file}" >&2
              exit 1
            fi
            echo "Another e2e build is running. Waiting for it to finish."
            sleep 30
          done
          echo "Started build ${build_id} for commit ${APPROVED_SHA}."
          echo "build_id=${build_id}" >> "${GITHUB_OUTPUT}"

      - name: Wait for the build
        id: wait
        env:
          BUILD_ID: ${{ steps.start.outputs.build_id }}
        run: |
          while true; do
            status="$(aws codebuild batch-get-builds --ids "${BUILD_ID}" \
              --query 'builds[0].buildStatus' --output text)"
            if [[ "${status}" != "IN_PROGRESS" ]]; then
              break
            fi
            sleep 15
          done
          echo "Build ${BUILD_ID} finished with status ${status}."
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      # The build status above is the result. The log is here to help the
      # author of the pull request, and a problem with it does not change the
      # result.
      - name: Show the build log
        if: always() && steps.start.outputs.build_id != ''
        continue-on-error: true
        env:
          BUILD_ID: ${{ steps.start.outputs.build_id }}
        run: |
          read -r group stream < <(aws codebuild batch-get-builds --ids "${BUILD_ID}" \
            --query 'builds[0].logs.[groupName,streamName]' --output text)

          # The log holds output of pull request code. Stop GitHub from reading
          # workflow commands in it.
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::${token}"
          trap 'echo "::${token}::"' EXIT

          next=""
          note="[the build log is longer than shown here]"
          for _ in $(seq 1 10); do
            args=(--log-group-name "${group}" --log-stream-name "${stream}" --start-from-head --output json)
            if [[ -n "${next}" ]]; then
              args+=(--next-token "${next}")
            fi
            if ! page="$(aws logs get-log-events "${args[@]}")"; then
              note="[could not read the build log]"
              break
            fi
            jq -r '.events[].message | rtrimstr("\n")' <<< "${page}"
            new="$(jq -r '.nextForwardToken' <<< "${page}")"
            if [[ "${new}" == "${next}" ]]; then
              note=""
              break
            fi
            next="${new}"
          done
          if [[ -n "${note}" ]]; then
            echo "${note}"
          fi

      - name: Fail unless the build succeeded
        env:
          STATUS: ${{ steps.wait.outputs.status }}
        run: |
          [[ "${STATUS}" == "SUCCEEDED" ]]

  report:
    name: Report the result
    needs: [resolve, run]
    if: always() && github.run_attempt == 1 && needs.resolve.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Set the commit status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RESULT: ${{ needs.run.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "${RESULT}" == "success" ]]; then
            state=success
            description="E2E build succeeded"
          else
            state=failure
            description="E2E run ended with result: ${RESULT}"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="${state}" -f context=e2e \
            -f description="${description}" -f target_url="${RUN_URL}" > /dev/null
